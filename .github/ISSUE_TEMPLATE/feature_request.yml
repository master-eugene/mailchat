name: Feature request
description: Suggest an idea for MailChat
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Does this expose new metadata or change what the server can see?

name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issues:** don't file them here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser and OS
      placeholder: "iPhone 15, Home Screen app, iOS 26.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any message text, keys or tokens first.
